name: checks

# Every push and PR runs the same checks a developer runs locally via
# `pwsh -File run_checks.ps1`.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pytest

      - name: Run all checks
        shell: pwsh
        run: pwsh -File run_checks.ps1